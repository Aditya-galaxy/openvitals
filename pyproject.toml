[project]
name = "openvitals"
version = "0.1.0"
description = "Open, validated sleep and recovery algorithms for wrist wearables, with a reproducible benchmark."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
mat73 = ["h5py>=3.10"]
seq = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "torch>=2.4",
]

[project.scripts]
openvitals = "openvitals.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openvitals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
